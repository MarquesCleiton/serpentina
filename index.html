<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F1E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Serpentina</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="carregando">
      <div id="titulo">SERPENTINA</div>
      <div id="barra"><div id="barra-cheia"></div></div>
      <div id="dica">Celular: deslize o dedo para mover a cobra</div>
    </div>
    <div id="girar">
      <div id="girar-icone"></div>
      <div>Gire o celular para jogar na vertical</div>
    </div>
    <div id="erro"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var carregando = document.querySelector("#carregando");
      var barra = document.querySelector("#barra-cheia");

      function mostrarAviso(msg, tipo) {
        if (tipo !== "error") { console.warn(msg); return; }
        var erro = document.querySelector("#erro");
        erro.textContent = msg;
        erro.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Teste Unity",
        productName: "Serpentina",
        productVersion: "0.1.0",
        showBanner: mostrarAviso,
        // Telas de celular chegam a 3x; 2x já fica nítido e pesa bem menos na GPU.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      // Sem isso o navegador rola ou dá zoom na página quando o dedo desliza no jogo.
      ["touchstart", "touchmove"].forEach(function (evento) {
        canvas.addEventListener(evento, function (e) { e.preventDefault(); }, { passive: false });
      });

      // No celular o jogo é vertical: no primeiro toque entra em tela cheia e, onde o
      // navegador deixa (Android), trava em retrato. No iPhone o aviso "gire o celular" cobre.
      if (window.matchMedia("(pointer: coarse)").matches) {
        canvas.addEventListener("touchend", function travarRetrato() {
          canvas.removeEventListener("touchend", travarRetrato);
          var raiz = document.documentElement;
          if (!raiz.requestFullscreen) return;
          raiz.requestFullscreen({ navigationUI: "hide" }).then(function () {
            if (screen.orientation && screen.orientation.lock) return screen.orientation.lock("portrait");
          }).catch(function () {});
        });
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progresso) {
          barra.style.width = (100 * progresso) + "%";
        }).then(function () {
          carregando.style.display = "none";
          canvas.focus();
        }).catch(function (msg) {
          mostrarAviso(msg, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
